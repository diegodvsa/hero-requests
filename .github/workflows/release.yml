name: Release
# Gera uma versão nova automaticamente a cada alteração no código enviada para a branch main
# (arquivos .go, web/, go.mod, go.sum). Alterações só no site (docs/) ou no README não geram versão.
# A versão é v1.0.N, onde N é o número da execução. Também dá para rodar à mão na aba Actions.
on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Testes
        run: |
          go vet ./...
          go test ./...
      - name: Compilar
        env:
          VERSION: v1.0.${{ github.run_number }}
        run: |
          mkdir dist
          for t in windows/amd64 linux/amd64 darwin/arm64 darwin/amd64; do
            os=${t%/*}; arch=${t#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="hero-requests-${VERSION}-${os}-${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/hero-requests${ext}" .
            (cd dist && zip -q "${name}.zip" "hero-requests${ext}" && rm "hero-requests${ext}")
          done
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Hero Requests v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: dist/*.zip
