name: Release
# Crie uma tag (ex.: git tag v0.1.0 && git push origin v0.1.0) e os executáveis
# são gerados e anexados a um Release automaticamente.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        run: |
          mkdir dist
          for t in windows/amd64 linux/amd64 darwin/arm64 darwin/amd64; do
            os=${t%/*}; arch=${t#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="hero-requests-${GITHUB_REF_NAME}-${os}-${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/hero-requests${ext}" .
            (cd dist && zip -q "${name}.zip" "hero-requests${ext}" && rm "hero-requests${ext}")
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
