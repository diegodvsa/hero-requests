<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Requests</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top" id="top">
  <h1>Hero Requests</h1>
  <div class="chips" id="chips"></div>
  <div class="actions">
    <button class="btn" id="btn-settings" type="button">Configurações</button>
  </div>
</header>

<main class="panel" id="panel" hidden>
  <section>
    <div class="h">Tocando agora</div>
    <div id="now"></div>
    <div class="row"><div class="h grow" id="q-title">Fila</div>
      <button class="btn sm" id="btn-clear" type="button">Limpar fila</button></div>
    <div id="queue" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="h">Adicionar manualmente</div>
    <input class="inp" id="add-q" type="search" placeholder="Buscar música para adicionar…" aria-label="Buscar música para adicionar" autocomplete="off">
    <div class="results" id="add-results"></div>
  </section>
  <section>
    <div class="h">Pedidos</div>
    <div class="card">
      <div class="set"><span>Pedidos abertos</span><button class="btn sm" id="btn-open" type="button"></button></div>
      <div class="set"><span>Máx. por pessoa</span><b id="r-max"></b></div>
      <div class="set"><span>Prioridade subs/VIP</span><b id="r-prio"></b></div>
    </div>
    <div class="h">Overlay do OBS</div>
    <div class="card">
      <div class="url" id="ov-url"></div>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="btn-copy-ov" type="button">Copiar link</button>
      <a class="btn sm" href="/overlay" target="_blank" rel="noopener" style="text-decoration:none">Abrir</a></div>
    </div>
    <div class="h">Chat ao vivo (comandos)</div>
    <div class="log card" id="log"></div>
    <div class="h">Simular pedido</div>
    <form class="row" id="sim-form">
      <input class="inp grow" id="sim-text" placeholder="!pedir artista - música" aria-label="Mensagem simulada">
      <button class="btn" type="submit">Enviar</button>
    </form>
    <div class="help">Testa o fluxo sem estar ao vivo. Aparece como um espectador de teste.</div>
    <div id="site-box"></div>
  </section>
</main>

<div id="settings" class="settings" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
