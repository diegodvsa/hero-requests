<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Overlay</title>
<style>
:root{--accent:#ff8a3d;--panel:#0f1117e6;--line:#2a2e3c;--fg:#e8eaf2;--mute:#8b91a5}
html,body{margin:0;background:transparent;color:var(--fg);font:15px/1.4 "Inter","Segoe UI",system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;top:16px;right:16px;width:380px;display:flex;flex-direction:column;gap:8px}
body.left #wrap{right:auto;left:16px}
.now{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:10px 14px}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.t{font:700 20px/1.2 "Space Grotesk","Segoe UI",sans-serif;overflow-wrap:anywhere}
.sub{color:var(--mute);font-size:13px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.n{width:16px;color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by{color:var(--mute);font-size:12px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.src{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;font-size:10px;font-weight:700;flex:none;background:var(--line)}
.src.twitch{background:#9146ff;color:#fff}.src.kick{background:#53fc18;color:#0b1a00}.src.manual{background:var(--accent);color:#1a0d00}
.hint{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--mute)}
code{color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace}
</style>
</head>
<body>
<div id="wrap"></div>
<script src="/static/overlay.js"></script>
</body>
</html>
